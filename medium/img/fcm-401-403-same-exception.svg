<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="460" fill="#ffffff"/>

  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">kreait/firebase-php 的例外轉換（修正前）</text>

  <!-- 401 box -->
  <rect x="12" y="40" width="216" height="120" rx="8" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.5"/>
  <text x="24" y="68" font-size="14" font-weight="bold" fill="#c0392b" font-family="ui-monospace,Consolas,monospace">HTTP 401</text>
  <text x="24" y="92" font-size="12.5" fill="#333">鑰匙（憑證）真的壞了</text>
  <text x="24" y="114" font-size="12.5" fill="#333">整個服務都發不出去</text>
  <text x="24" y="140" font-size="12.5" font-weight="bold" fill="#c0392b">→ 要半夜叫人起來修</text>

  <!-- 403 box -->
  <rect x="12" y="300" width="216" height="120" rx="8" fill="#edf7f3" stroke="#1e8e6e" stroke-width="1.5"/>
  <text x="24" y="326" font-size="14" font-weight="bold" fill="#1e8e6e" font-family="ui-monospace,Consolas,monospace">HTTP 403</text>
  <text x="24" y="344" font-size="11.5" fill="#1e8e6e" font-family="ui-monospace,Consolas,monospace">SENDER_ID_MISMATCH</text>
  <text x="24" y="368" font-size="12.5" fill="#333">鑰匙沒問題，只是這個</text>
  <text x="24" y="388" font-size="12.5" fill="#333">token 是別人家的</text>
  <text x="24" y="412" font-size="12.5" font-weight="bold" fill="#1e8e6e">→ 把它移掉就好</text>

  <!-- converter box -->
  <rect x="280" y="170" width="168" height="120" rx="8" fill="#f4f4f4" stroke="#666" stroke-width="1.5"/>
  <text x="292" y="196" font-size="13" font-weight="bold" fill="#222" font-family="ui-monospace,Consolas,monospace">MessagingApi</text>
  <text x="292" y="213" font-size="13" font-weight="bold" fill="#222" font-family="ui-monospace,Consolas,monospace">ExceptionConverter</text>
  <line x1="292" y1="224" x2="436" y2="224" stroke="#bbb" stroke-width="1"/>
  <text x="292" y="245" font-size="12" fill="#444" font-family="ui-monospace,Consolas,monospace">case 401:</text>
  <text x="292" y="263" font-size="12" fill="#444" font-family="ui-monospace,Consolas,monospace">case 403:</text>
  <text x="292" y="282" font-size="12" fill="#666">→ 走同一條路</text>

  <!-- exception box -->
  <rect x="496" y="182" width="176" height="96" rx="8" fill="#fff8e1" stroke="#b7950b" stroke-width="1.5"/>
  <text x="584" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7d6608" font-family="ui-monospace,Consolas,monospace">AuthenticationError</text>
  <text x="584" y="236" text-anchor="middle" font-size="12.5" fill="#333">「認證錯誤」</text>
  <text x="584" y="260" text-anchor="middle" font-size="12" fill="#333">兩種問題，同一張臉</text>

  <!-- note box -->
  <rect x="496" y="298" width="176" height="112" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="584" y="326" text-anchor="middle" font-size="12" fill="#555">我們的程式 catch 到的</text>
  <text x="584" y="348" text-anchor="middle" font-size="12" fill="#555">永遠是同一個例外，</text>
  <text x="584" y="370" text-anchor="middle" font-size="12" fill="#555">分不出到底要不要</text>
  <text x="584" y="392" text-anchor="middle" font-size="12" fill="#555">叫醒工程師</text>

  <!-- arrows -->
  <line x1="228" y1="100" x2="274" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="228" y1="360" x2="274" y2="252" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="448" y1="230" x2="490" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="584" y1="278" x2="584" y2="292" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
